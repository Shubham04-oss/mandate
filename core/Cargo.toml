[package]
name = "mandate"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.13.3"
aws-credential-types = "1.3.1"
aws-sdk-bedrockagentcore = "1.88"
aws-sigv4 = "1.6.6"
base64 = "0.23.1"
cedar-policy = "4.15"
chromiumoxide = "0.9.1"
ed25519-dalek = "3"
futures = "0.3.34"
http = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid", "macros", "migrate"] }
thiserror = "2"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

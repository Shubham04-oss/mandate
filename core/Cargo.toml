[package]
name = "mandate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1.92"
# chromiumoxide builds it without TLS; the AgentCore automation stream is wss.
async-tungstenite = { version = "0.32.1", features = ["tokio-rustls-webpki-roots"] }
aws-config = "1.13.3"
aws-credential-types = "1.3.1"
aws-sdk-bedrockagentcore = { version = "1.88", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.6.6"
aws-sdk-eventbridgev2 = { version = "1.7", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.119", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = "0.8.9"
base64 = "0.23.1"
cedar-policy = "4.15"
chromiumoxide = "0.9.1"
clap = { version = "4.6.9", features = ["derive"] }
ed25519-dalek = { version = "3", features = ["pem"] }
futures = "0.3.34"
getrandom = "0.3"
http = "1.5.0"
rustls = "0.23.46"
schemars = { version = "1.2.3", features = ["uuid1"] }
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
# Already in the tree through workos; the core's client for eve's private session API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid", "json", "macros", "migrate"] }
thiserror = "2"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["cors", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.9"
uuid = { version = "1", features = ["v4", "serde"] }
workos = "3.7"

[dev-dependencies]
cedar-policy-symcc = "0.9.0"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

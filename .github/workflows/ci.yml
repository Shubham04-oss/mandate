name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run; main keeps every run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The live tests migrate as this superuser and run as the least-privilege app role.
      DATABASE_URL: postgres://postgres:mandate@127.0.0.1:5432/mandate
      REQUIRE_PROOFS: "1"
      CVC5_VERSION: "1.3.1"
      CVC5_SHA256: 1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # Restores ~/.cargo and target/ keyed on Cargo.lock and the toolchain; saved only from main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A checksummed release binary instead of compiling it on every run.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: Install cvc5
        run: |
          curl -fsSLo /tmp/cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static.zip"
          echo "${CVC5_SHA256}  /tmp/cvc5.zip" | sha256sum -c -
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5
          bin="$(find /tmp/cvc5 -type f -name cvc5 -path '*/bin/*' | head -n1)"
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/cvc5
          cvc5 --version
      # main's event schema, so the check can refuse a change that isn't additive (docs/events.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false
          sparse-checkout: schema/events
          sparse-checkout-cone-mode: false
      - name: Check
        run: scripts/check.sh
        env:
          MANDATE_EVENTS_BASE_SCHEMA: ${{ github.workspace }}/base/schema/events/v1.json

  agents:
    runs-on: ubuntu-latest
    # eve's CLI would otherwise send usage data to Vercel from CI.
    env:
      EVE_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - run: npm ci
      - run: npm run check

  emails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: emails/package-lock.json
      - run: npm ci
      - run: npm run check
      # Builds every template, then checks the output: placeholders, Outlook, Gmail, plain text.
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A production build must name the core; a placeholder proves it builds. The refusal without
      # one is covered by src/lib/api/api-url.test.ts.
      - run: npm run build
        env:
          VITE_MANDATE_API_URL: https://api.example.com
      # Serves that build in the Worker runtime and checks a rendered page's headers and nonces.
      - run: npm run test:dist

  infra:
    runs-on: ubuntu-latest
    # A scratch server of its own: the db-bootstrap SQL test drops and recreates databases and roles.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRA_TEST_DATABASE_URL: postgres://postgres:scratch@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      # Offline: fmt, validate, plan-time tests against mock providers and the db-bootstrap SQL test;
      # no cloud credentials.
      - name: Check infra
        run: infra/check.sh

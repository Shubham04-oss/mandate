name: deploy

# Off until the owner turns it on (docs/deploy.md): every job needs the repository variable
# MANDATE_DEPLOY_ENABLED=true, so merging to main deploys nothing by itself.
# Runs only after ci passes on a push to main, so a red main never migrates or rolls.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  CLUSTER: mandate-dev
  # The commit ci tested; github.sha of a workflow_run is main's tip when it fired, maybe newer.
  TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    if: >-
      vars.MANDATE_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.tip.outputs.go }}
    steps:
      # ci runs on main overlap, so an older commit can go green after a newer one; deploying it
      # would roll the code back. The newer commit deploys when its own ci passes.
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$tip" = "$TAG" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is no longer main's tip ($tip); skipping its deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The deploy role trusts this repository's `dev` environment only; add reviewers there if wanted.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # A docker-container builder, so the core's dependency layer persists in the GitHub Actions cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check which core images are already pushed
        id: pushed
        run: |
          set -euo pipefail
          # Tags are immutable, so a rerun of the same commit reuses what an earlier run pushed.
          has() {
            aws ecr describe-images --repository-name mandate-dev/core --image-ids imageTag="$1" >/dev/null 2>&1 \
              && echo true || echo false
          }
          echo "core=$(has "$TAG")" >> "$GITHUB_OUTPUT"
          echo "migrate=$(has "migrate-$TAG")" >> "$GITHUB_OUTPUT"

      - name: Build and push the core image
        if: steps.pushed.outputs.core != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: core/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/mandate-dev/core:${{ env.TAG }}
          # A plain image manifest, as `docker build` pushed before.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max

      - name: Build and push the migrate image
        if: steps.pushed.outputs.migrate != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: core/Dockerfile
          target: migrate
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/mandate-dev/core:migrate-${{ env.TAG }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=core

      # eve (agents/) lands in its own lane; until then the eve service is left as it is.
      - name: Build and push the eve image
        if: hashFiles('agents/package.json') != ''
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/mandate-dev/eve
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name mandate-dev/eve --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "eve image for $TAG already pushed"
            exit 0
          fi
          docker build -f agents/Dockerfile -t "$REPO:$TAG" agents
          docker push "$REPO:$TAG"

      # Each task definition's latest revision (tofu's config, or the last deploy's) gets the new
      # image, so infra changes ride along with the next deploy.
      - name: Migrate, then roll the services
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          NETWORK: ${{ vars.MANDATE_MIGRATE_NETWORK }}
          WITH_EVE: ${{ hashFiles('agents/package.json') != '' }}
        run: |
          set -euo pipefail
          render() {
            aws ecs describe-task-definition --task-definition "$1" --query taskDefinition \
              | jq --arg image "$2" '.containerDefinitions[0].image = $image
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
              > "$RUNNER_TEMP/td.json"
            aws ecs register-task-definition --cli-input-json "file://$RUNNER_TEMP/td.json" \
              --query taskDefinition.taskDefinitionArn --output text
          }
          roll() {
            td="$(render "mandate-dev-$1" "$2")"
            dep="$(aws ecs update-service --cluster "$CLUSTER" --service "$1" --task-definition "$td" \
              --query "service.deployments[?status=='PRIMARY'].id | [0]" --output text)"
            # Follow this deployment by id: `services-stable` also ends stable after a circuit-breaker
            # rollback, and the rollback becomes the new PRIMARY. 100 polls x 15 s = 25 minutes.
            for _ in $(seq 100); do
              state="$(aws ecs describe-services --cluster "$CLUSTER" --services "$1" \
                --query "services[0].deployments[?id=='$dep'].rolloutState | [0]" --output text)"
              echo "$1 $dep: $state"
              case "$state" in
                COMPLETED) echo "$1 is on $td"; return 0 ;;
                IN_PROGRESS) sleep 15 ;;
                *) echo "::error::$1 did not roll out $td ($state): the circuit breaker rolls back"; exit 1 ;;
              esac
            done
            echo "::error::$1 did not finish rolling out $td in 25 minutes"
            exit 1
          }

          td="$(render mandate-dev-migrate "$REGISTRY/mandate-dev/core:migrate-$TAG")"
          task="$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "$td" --network-configuration "$NETWORK" \
            --query 'tasks[0].taskArn' --output text)"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          code="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)"
          echo "migrate exited with $code"
          test "$code" = 0

          roll core "$REGISTRY/mandate-dev/core:$TAG"
          if [ "$WITH_EVE" = true ]; then
            roll eve "$REGISTRY/mandate-dev/eve:$TAG"
          fi

  # The web app ships after the core, so it never calls an API the live core doesn't have yet.
  web:
    needs: deploy
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # A Workers-only token; Wrangler reads it and the account id from the environment.
      - name: Build and deploy to app.oryxa.in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # PostHog's public project key; empty keeps browser analytics and /ingest off.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        run: npm run deploy

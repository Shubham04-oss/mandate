[advisories]
ignore = [
    # No maintained release exists; pulled by cedar-policy-core (also rmcp and schemars) for dates only.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade; transitive via cedar-policy-core" },
]

[licenses]
# Permissive licences only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = [
    # The Mozilla CA bundle as data; forced by sqlx tls-rustls, reqwest and the AWS HTTP client.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # Blue Oak 1.0.0 is a permissive (OSI) licence; the CBOR codec the EventBridge v2 SDK speaks.
    { crate = "minicbor", allow = ["BlueOak-1.0.0"] },
]

[licenses.private]
# The workspace crate is `publish = false`; its own missing licence is not a dependency's.
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
